services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: service-2
    env_file:
      - src/.env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: bd-2
    environment:
      POSTGRES_DB: service-2
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
